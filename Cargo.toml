[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["René Coignard <contact@renecoignard.com>"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/coignard/taskmgr"
publish = false

[workspace.dependencies]
taskmgr = { path = "crates/taskmgr" }

cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
fastrand = "2.5"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
jiff = { version = "0.2", features = ["serde"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
plist = "1.10"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
tempfile = "3.27"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
