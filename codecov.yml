coverage:
  precision: 1
  round: down
  range: 60..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
      core:
        target: auto
        threshold: 1%
        paths:
          - "crates/taskmgr/"
    patch:
      default:
        target: 60%
        threshold: 1%
ignore:
  - "crates/taskmgr-macos"
  - "crates/taskmgr/src/app/tests.rs"
  - "xtask"
comment:
  require_changes: true
